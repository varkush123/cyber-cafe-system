<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cyber cafe management system</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'login.css'%}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
</head>

<body>
    
    <div class ="background">
        <div class="Cyber">
            <H1>𝓬𝔂𝓫𝓮𝓻 𝓬𝓪𝓯𝓮 </H1>
    
        </div>
        <div class="manu">
             <ul>
                    <li><a href="home.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="login.html">Login</a></li>
             </ul>
            
        </div>
    <div class="wrapper">
        <form action="{% url 'logination' %}" method="post">
            {% csrf_token %}
            <H2>Login</H2>
            <div class="input-box">
                <input type="text" placeholder="Username" name="username" required>
                <i class="fa fa-user"></i>
            </div>
            <div class="input-box">
                <input type="password" placeholder="Password" name="password" required>
                <i class="fa fa-lock"></i>
            </div>

            <button type="submit" class="btn">Login</button>
    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
            <li>{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}


        </form>

    </div>    
    </div>
    <script>
        // Function to make error message blink
        function blinkErrorMessage() {
            var errorMessage = document.querySelector('.messages li');
            errorMessage.classList.add('blink');
    
            setTimeout(function() {
                errorMessage.classList.remove('blink');
            }, 10000); // Blink for 5 seconds
        }
    
        // Call blinkErrorMessage function after page load
        window.onload = function() {
            blinkErrorMessage();
        };
    </script>
    

</body>
</html>
